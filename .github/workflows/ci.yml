name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Vendored renderer + template integrity (doctor)
        run: node bin/prechify.mjs doctor
      - name: Contract + CLI tests (incl. full deliver of the demo deck)
        run: node --test tests/

  # Planned for v0.2: browser acceptance (chromium/firefox/webkit via
  # playwright) and an offline unpacked-skill smoke job. Not claimed until run.
